version: 2.1

commands:
  scan-common-security-vulnerabilities:
    steps:
      - run:
          name: Run brakeman
          command: |
            bin/brakeman --no-pager --force

jobs:
  build:
    docker:
      - image: ruby:3.4.3
    steps:
      - checkout
      - run:
          name: Build ruby version
          command: |
            gem install bundler
            gem build ballantine.gemspec
            gem install ballantine*.gem
      - run:
          name: Run ballantine
          command: |
            echo "$ ballantine"
            ballantine
            echo "$ ballantine version"
            ballantine version
            echo "$ ballantine init"
            ballantine init
  test:
    docker:
      - image: ruby:3.4.3
    steps:
      - checkout
      - run:
          name: bundle install
          command: |
            gem install bundler
            bundle config
            bundle check || bundle install
      - scan-common-security-vulnerabilities
      - run:
          name: rspec
          command: |
            bundle exec rspec --format progress --format RspecJunitFormatter -o /tmp/test-results/rspec.xml
      - store_test_results:
          path: /tmp/test-results
workflows:
  build_and_test:
    jobs:
      - build
      - test
